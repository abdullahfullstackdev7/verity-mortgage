[project]
name = "verity-mortgage"
version = "0.1.0"
description = "Underwriting document automation platform built on public HMDA data."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "easyocr>=1.7.2",
    "email-validator>=2.3.0",
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
    "xhtml2pdf>=0.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "generators", "backend"]

[project]
name = "verity-mortgage"
version = "0.1.0"
description = "Underwriting document automation platform built on public HMDA data."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "easyocr>=1.7.2",
    "email-validator>=2.3.0",
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
    "xhtml2pdf>=0.2.20",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.2",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    # FastAPI's `param: Type = Depends(...)` pattern is a function call in
    # an argument default by design -- not the bug B008 flags elsewhere.
    "B008",
    # str+Enum vs StrEnum is a style preference, not a bug; switching risks
    # subtle behavior differences (JSON/repr formatting) across a codebase
    # that already relies on the str-mixin behavior everywhere.
    "UP042",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # pytest.raises(Exception) is deliberate in a couple of tests
"backend/alembic/env.py" = ["F403", "F405"]  # star-import needed to register all models on Base.metadata
"backend/alembic/versions/*" = ["E501"]  # autogenerated migrations, not hand-styled

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "backend/alembic/versions/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "generators", "backend"]
